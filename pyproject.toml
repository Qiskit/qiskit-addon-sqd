[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qiskit-addon-sqd"
version = "0.14.0"
readme = "README.md"
description = "Classically postprocess noisy quantum samples to yield more accurate energy estimations"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

requires-python = ">=3.11"

dependencies = [
    "qiskit>=2.0, <3",
    "numpy>=2.0",
    "pyscf>=2.9; sys_platform != 'win32'",
    "jaxlib>=0.4.30",
    "jax>=0.4.30",
    "scipy>=1.14.1",
]

[project.optional-dependencies]
fulqrum = [
    "fulqrum>=0.5.0",
    "primme>=3.2.3",
]
sbd = [
    "sbd-eigensolver>=1.6.1",
]
dev = [
    "qiskit-addon-sqd[test,nbtest,lint,docs]",
    "tox>=4.21.2",
]
basetest = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
test = [
    "qiskit-addon-sqd[basetest]",
]
nbtest = [
    "qiskit-addon-sqd[basetest]",
    "nbmake>=1.5.0",
]
style = [
    "ruff==0.17.3",
    "nbqa>=1.8.5",
    # tools/notebook_execution_counts.py, which both style and lint run. nbqa does not
    # depend on nbformat, so nothing else in these environments provides it. 5.5.0 is
    # the first release carrying nbformat.warnings, which that script silences.
    "nbformat>=5.5.0",
]
lint = [
    "qiskit-addon-sqd[style]",
    "mypy==2.4.1",
    "pylint==4.1.3",
    "reno>=4.1",
    "toml>=0.9.6",
]
notebook-dependencies = [
    "qiskit-addon-sqd[fulqrum]",
    "qiskit-addon-sqd[sbd]",
    "qiskit-addon-utils",
    "qiskit-aer",
    "matplotlib",
    "pylatexenc",
    "ffsim>=0.0.58",
    "qiskit",
    "qiskit-ibm-runtime",
]
docs = [
    "qiskit-addon-sqd[test,notebook-dependencies]",
    "qiskit-sphinx-theme~=2.1.0",
    "jupyter-sphinx",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx_reredirects",
    "nbsphinx>=0.9.4",
    "reno>=4.1",
]

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.hatch.build.targets.wheel]
only-include = [
    "qiskit_addon_sqd",
]

[tool.mypy]
# Deliberately ahead of requires-python.  numpy's stubs use PEP 695 "type"
# statements, which mypy rejects unless it is analyzing as 3.12 or later.
python_version = "3.12"
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pylint]
py-version = "3.11"
load-plugins = ["pylint.extensions.no_self_use"]

[tool.pylint."messages control"]
disable = ["all"]
enable = [
    "reimported",
    "no-else-raise",
    "redefined-argument-from-local",
    "redefined-builtin",
    "raise-missing-from",
    "cyclic-import",
    "unused-argument",
    "attribute-defined-outside-init",
    "no-else-return",
]

[tool.pytest.ini_options]
testpaths = ["./qiskit_addon_sqd/", "./test/"]

[tool.ruff]
line-length = 100
src = ["qiskit_addon_sqd", "test"]
target-version = "py39"

[tool.ruff.lint]
select = [
    "I",   # isort
    "E",   # pycodestyle
    "W",   # pycodestyle
    "D",   # pydocstyle
    "F",   # pyflakes
    "RUF", # ruff
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.extend-per-file-ignores]
"test/**.py" = [
    "D",  # pydocstyle
]
"docs/**/*" = [
    "E402", # module level import not at top of file
    "D",    # pydocstyle
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = """
# This code is a Qiskit project.
#
# \\(C\\) Copyright IBM \\d{4}((,\\s)\\d{4})*\\.
#
# This code is licensed under the Apache License, Version 2\\.0\\. You may
# obtain a copy of this license in the LICENSE\\.txt file in the root directory
# of this source tree or at http\\:\\/\\/www\\.apache\\.org\\/licenses\\/LICENSE\\-2\\.0\\.
#
# Any modifications or derivative works of this code must retain this
# copyright notice, and modified files need to carry a notice indicating
# that they have been altered from the originals\\.
"""

[tool.ruff.lint.pydocstyle]
convention = "google"
