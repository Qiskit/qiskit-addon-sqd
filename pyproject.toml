[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "qiskit-addon-sqd"
version = "0.13.0"
readme = "README.md"
description = "Classically postprocess noisy quantum samples to yield more accurate energy estimations"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

requires-python = ">=3.10"

dependencies = [
    "qiskit>=2.0, <3",
    "numpy>=2.0",
    "pyscf>=2.9; sys_platform != 'win32'",
    "jaxlib>=0.4.30",
    "jax>=0.4.30",
    "scipy>=1.14.1",
]

[project.optional-dependencies]
fulqrum = [
    "fulqrum>=0.4.4",
    "primme>=3.2.3",
]
dev = [
    "qiskit-addon-sqd[test,nbtest,lint,docs]",
    "tox>=4.11.4",
]
basetest = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
test = [
    "qiskit-addon-sqd[basetest]",
]
nbtest = [
    "qiskit-addon-sqd[basetest]",
    "nbmake>=1.5.0",
]
style = [
    "ruff==0.16.5",
    "nbqa>=1.8.5",
]
lint = [
    "qiskit-addon-sqd[style]",
    "mypy==2.3.1",
    "pylint==4.0.8",
    "reno>=4.1",
    "toml>=0.9.6",
]
notebook-dependencies = [
    "qiskit-addon-sqd[fulqrum]",
    "qiskit-addon-utils",
    "qiskit-aer",
    "matplotlib",
    "pylatexenc",
    "ffsim>=0.0.58",
    "qiskit",
    "qiskit-ibm-runtime",
]
docs = [
    "qiskit-addon-sqd[test,notebook-dependencies]",
    "qiskit-sphinx-theme~=2.1.0",
    "jupyter-sphinx",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx_reredirects",
    "nbsphinx>=0.9.4",
    "reno>=4.1",
]

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.scikit-build]
# The compiled extension (qiskit_addon_sqd._accel) accelerates configuration
# recovery via the C++ implementation from qiskit-addon-sqd-hpc.  It is an
# optional fast path: recover_configurations falls back to pure Python when the
# extension is unavailable, so a purelib wheel (built with -C cmake=false) and
# source installs without a compiler both work.
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["qiskit_addon_sqd"]

# Ship the vendored qiskit-addon-sqd-hpc headers (a git submodule) in the sdist
# so that source installs can compile the extension without needing to fetch
# submodules separately.
sdist.include = [
    "deps/qiskit-addon-sqd-hpc/include/**",
    "deps/qiskit-addon-sqd-hpc/LICENSE.txt",
]

[tool.cibuildwheel]
# Build binary wheels for the supported CPython versions.  Windows is
# intentionally excluded for now (see release.yml), and PyPy is not targeted.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 pp* *_i686"
build-frontend = "build"
# Smoke-test each built wheel: confirm the compiled extension is present and
# that accelerated recovery runs.  Kept dependency-light (no pyscf/jax) so it
# works on every wheel target.
test-requires = ["numpy>=2.0", "qiskit>=1.3,<3"]
test-command = "python {project}/test/smoke_test_accel.py"

[tool.cibuildwheel.linux]
# Build both manylinux and musllinux variants.
archs = ["native"]

[tool.mypy]
python_version = "3.10"
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pylint]
py-version = "3.10"
load-plugins = ["pylint.extensions.no_self_use"]

[tool.pylint."messages control"]
disable = ["all"]
enable = [
    "reimported",
    "no-else-raise",
    "redefined-argument-from-local",
    "redefined-builtin",
    "raise-missing-from",
    "cyclic-import",
    "unused-argument",
    "attribute-defined-outside-init",
    "no-else-return",
]

[tool.pytest.ini_options]
testpaths = ["./qiskit_addon_sqd/", "./test/"]

[tool.ruff]
line-length = 100
src = ["qiskit_addon_sqd", "test"]
target-version = "py39"

[tool.ruff.lint]
select = [
    "I",   # isort
    "E",   # pycodestyle
    "W",   # pycodestyle
    "D",   # pydocstyle
    "F",   # pyflakes
    "RUF", # ruff
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.extend-per-file-ignores]
"test/**.py" = [
    "D",  # pydocstyle
]
"docs/**/*" = [
    "E402", # module level import not at top of file
    "D",    # pydocstyle
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = """
# This code is a Qiskit project.
#
# \\(C\\) Copyright IBM \\d{4}((,\\s)\\d{4})*\\.
#
# This code is licensed under the Apache License, Version 2\\.0\\. You may
# obtain a copy of this license in the LICENSE\\.txt file in the root directory
# of this source tree or at http\\:\\/\\/www\\.apache\\.org\\/licenses\\/LICENSE\\-2\\.0\\.
#
# Any modifications or derivative works of this code must retain this
# copyright notice, and modified files need to carry a notice indicating
# that they have been altered from the originals\\.
"""

[tool.ruff.lint.pydocstyle]
convention = "google"
