---
features:
  - |
    Adds a `guide <https://qiskit.github.io/qiskit-addon-sqd/guides/integrate_fulqrum.html>`__
    showing how to use `fulqrum <https://github.com/qiskit-community/fulqrum>`__
    as a subspace solver for fermionic systems.
    To install the optional dependency, use the ``fulqrum`` extra::

        pip install qiskit-addon-sqd[fulqrum]
