---
features:
  - |
    This package is now a `coheriq <https://github.com/Qiskit/coheriq>`__
    *domain*:
    :func:`~qiskit_addon_sqd.configuration_recovery.recover_configurations` is
    marked as a candidate for acceleration, and the package ships a compiled
    ``sqd-hpc`` *engine* that reimplements it using the C++ code in
    `qiskit-addon-sqd-hpc <https://github.com/Qiskit/qiskit-addon-sqd-hpc>`__.
    The engine is opt-in: activate it with
    ``coheriq.enable_engine("qiskit_addon_sqd", "sqd-hpc")`` or by setting the
    ``QISKIT_ADDON_SQD_ENGINE=sqd-hpc`` environment variable, after which every
    call to ``recover_configurations`` transparently uses the compiled
    implementation.  Without activation, the pure-Python default is used, so the
    public API is unchanged.
upgrade:
  - |
    Binary wheels are now published for Linux (x86_64 and aarch64, both
    ``manylinux`` and ``musllinux``) and macOS (arm64 and x86_64), in addition
    to a universal pure-Python ``py3-none-any`` wheel. ``pip`` automatically
    selects the most specific wheel for your platform, falling back to the
    universal wheel or a source build where no binary wheel is available.
  - |
    The ``sqd-hpc`` engine requires the compiled extension, so it is available
    from the binary wheels and from source builds that compile it.  The universal
    ``py3-none-any`` wheel ships no compiled extension and does not advertise the
    engine: ``coheriq.enable_engine("qiskit_addon_sqd", "sqd-hpc")`` raises
    ``CoheriqEngineNotFoundError`` there, and
    :func:`~qiskit_addon_sqd.configuration_recovery.recover_configurations` uses
    the pure-Python implementation.  To see which engines an installation
    provides::

      python -c "from importlib.metadata import distribution; \
                 print(distribution('qiskit-addon-sqd').read_text('sqd_engine_build_info.json'))"
