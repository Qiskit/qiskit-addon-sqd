[tox]
minversion = 4.11.4
envlist = py{310,311,312,313,314}{,-engine,-purelib,-notebook}, lint, coverage, docs
isolated_build = True

[testenv]
package = wheel
wheel_build_env = .pkg
parallel_show_output = True
extras =
  test
# Pass through the engine-selection variable so a developer running
# `QISKIT_ADDON_SQD_ENGINE=sqd-hpc tox` exercises the compiled engine; tox
# otherwise scrubs the environment.
passenv =
  QISKIT_ADDON_SQD_ENGINE
# Import test modules by path rather than by inserting their root on sys.path.
# test/__init__.py makes pytest's default `prepend` mode insert the first
# non-package parent -- the repository root -- at sys.path[0], where the
# uncompiled qiskit_addon_sqd/ source tree then shadows the wheel tox installed.
# That hides the compiled extension, so the engine environment below cannot load
# it.  Keep this on the plain environments too, so both test the installed wheel.
commands =
  pytest --import-mode=importlib {posargs}

[testenv:{,py-,py3-,py310-,py311-,py312-,py313-,py314-}engine]
# Run the entire test suite a second time with the compiled `sqd-hpc` engine
# activated via the environment variable coheriq reads on first use.  This
# proves the suite passes identically whether the pure-Python default or the
# engine is in effect.
extras =
  test
setenv =
  QISKIT_ADDON_SQD_ENGINE = sqd-hpc
commands =
  pytest --import-mode=importlib {posargs}

# Run the suite against the universal (py3-none-any) wheel -- the one published
# for platforms with no binary wheel, and the one a user without a compiler
# installs.  It ships no compiled extension, so recover_configurations takes the
# pure-Python path and no `sqd-hpc` engine is advertised; the whole suite must
# pass there just as it does against a compiled build.
#
# There is deliberately no `purelib-engine` environment.  A universal wheel
# declares no sqd-hpc entry point, so selecting that engine against one raises
# CoheriqEngineNotFoundError by design.  Rather than encode that as a skip rule
# somewhere, the combination simply does not exist, and
# test/test_engine_packaging.py asserts the entry point is absent here.
[testenv:{,py-,py3-,py310-,py311-,py312-,py313-,py314-}purelib]
wheel_build_env = .pkg-purelib
extras =
  test
commands =
  pytest --import-mode=importlib {posargs}

# Build the universal wheel by turning off the CMake step, the same way
# release.yml builds the published one.  A separate packaging environment from
# the default `.pkg` so both wheel kinds can be built in a single tox run
# without either clobbering the other.
[testenv:.pkg-purelib]
config_settings_build_wheel =
    wheel.cmake = false

[testenv:style]
extras =
  style
commands =
  ruff format qiskit_addon_sqd/ docs/ test/
  ruff check --fix qiskit_addon_sqd/ docs/ test/
  nbqa ruff --fix docs/

[testenv:lint]
image-tester-commit = 7ae965ccf21c39e5170334ec7f4882756883860a
deps = 
  git+https://github.com/Qiskit/documentation.git@{[testenv:lint]image-tester-commit}\#egg=sphinx-alt-text-validator&subdirectory=scripts/image-tester
basepython = python3.10
extras =
  lint
commands =
  ruff format --check qiskit_addon_sqd/ docs/ test/
  ruff check qiskit_addon_sqd/ docs/ test/
  ruff check --preview --select CPY001 --exclude "*.ipynb" qiskit_addon_sqd/ test/
  nbqa ruff docs/
  mypy qiskit_addon_sqd/
  pylint -rn qiskit_addon_sqd/ test/
  sphinx-alt-text-validator -f qiskit_addon_sqd
  nbqa pylint -rn docs/
  reno lint

[testenv:{,py-,py3-,py310-,py311-,py312-,py313-,py314-}notebook]
extras =
  nbtest
  notebook-dependencies
commands =
  pytest --nbmake \
         --nbmake-timeout=3000 \
         --ignore=docs/guides/benchmark_pauli_projection.ipynb \
         --ignore=docs/guides/integrate_dice_solver.ipynb \
         --ignore=docs/guides/use_oo_to_optimize_hamiltonian_basis.ipynb \
         --ignore=docs/guides/choose_subspace_dimension.ipynb \
         {posargs} docs/

[testenv:coverage]
deps =
  coverage>=7.5
extras =
  test
# Measure both dispatch paths.  The pure-Python default and the compiled
# `sqd-hpc` engine implement the same acceleration candidates, so a run that
# exercises only one leaves the other entirely unexecuted -- measuring just the
# default reports `_sqd_hpc_engine.py` at 0% and drops the total below the
# threshold.  pytest-cov's `--cov-append` accumulates the second run into the
# first's data file, so the report covers the union of the two.
#
# Both measurement commands run from an empty directory, because `--cov` takes an
# importable name and coverage resolves it the way Python would: from the
# repository root that finds the uncompiled `qiskit_addon_sqd/` source tree, while
# pytest imports the wheel tox installed.  Coverage would then measure files that
# never execute and report 0%.  `env -C` sets the directory for a single command,
# leaving the reports to run from the project root, where the relative patterns in
# [tool.coverage.paths] resolve.  Only the measurement needs to move, so the test
# paths are given absolutely.
#
# The engine is selected per command with `env` for the same reason: tox applies
# `setenv` to a whole environment rather than to a single command.  Linux only, as
# is coverage.yml.
allowlist_externals =
  env
setenv =
  COVERAGE_FILE = {tox_root}/.coverage
  COVERAGE_RCFILE = {tox_root}/pyproject.toml
commands =
  env -C {env_tmp_dir} pytest --import-mode=importlib --cov=qiskit_addon_sqd --cov-report= --cov-fail-under=0 {tox_root}/test/ {posargs}
  env -C {env_tmp_dir} QISKIT_ADDON_SQD_ENGINE=sqd-hpc pytest --import-mode=importlib --cov=qiskit_addon_sqd --cov-append --cov-report= --cov-fail-under=0 {tox_root}/test/ {posargs}
  python -m coverage html -d {tox_root}/htmlcov
  python -m coverage report --fail-under=75 --show-missing

[testenv:docs]
basepython = python3.10
extras =
  docs
commands =
  sphinx-build -j auto -W -T --keep-going -b html {posargs} {toxinidir}/docs/ {toxinidir}/docs/_build/html
passenv =
  CI
  GITHUB_BASE_REF
  GITHUB_REF_NAME

[testenv:docs-clean]
skip_install = true
allowlist_externals =
  rm
commands =
  rm -rf {toxinidir}/docs/stubs/ {toxinidir}/docs/_build/
