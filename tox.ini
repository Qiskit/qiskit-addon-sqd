[tox]
minversion = 4.4.3
envlist = py{310,311,312,313,314}{,-notebook}, lint, coverage, docs
isolated_build = True

[testenv]
package = wheel
wheel_build_env = .pkg
parallel_show_output = True
extras =
  test
commands =
  pytest {posargs}

[testenv:style]
extras =
  style
commands =
  ruff format qiskit_addon_sqd/ docs/ test/
  ruff check --fix qiskit_addon_sqd/ docs/ test/
  nbqa ruff --fix docs/

[testenv:lint]
image-tester-commit = 7ae965ccf21c39e5170334ec7f4882756883860a
deps = 
  git+https://github.com/Qiskit/documentation.git@{[testenv:lint]image-tester-commit}\#egg=sphinx-alt-text-validator&subdirectory=scripts/image-tester
basepython = python3.10
extras =
  lint
commands =
  ruff format --check qiskit_addon_sqd/ docs/ test/
  ruff check qiskit_addon_sqd/ docs/ test/
  ruff check --preview --select CPY001 --exclude "*.ipynb" qiskit_addon_sqd/ test/
  nbqa ruff docs/
  mypy qiskit_addon_sqd/
  pylint -rn qiskit_addon_sqd/ test/
  sphinx-alt-text-validator -f qiskit_addon_sqd
  nbqa pylint -rn docs/
  reno lint

[testenv:{,py-,py3-,py310-,py311-,py312-,py313-,py314-}notebook]
# Work around Qiskit/qiskit#17213: with qiskit 2.6.0 these notebooks fail on Linux
# before any cell runs, with "cannot allocate memory in static TLS block".
#
# glibc sizes the per-thread TLS block at startup and keeps only a small surplus for
# libraries dlopen'ed afterwards that need initial-exec TLS. Every Python extension
# module arrives that way, so they all draw on that surplus, and the one that fails is
# whichever asks last rather than whichever took the space -- which is why the error
# names qiskit's own _accelerate in one notebook and a bundled libgomp in another.
# qiskit 2.6.0's _accelerate grew from 736 to 1544 bytes of it, leaving too little for
# the next extension. Only this env installs Aer and sbd-eigensolver alongside qiskit,
# so only this env runs out. The value matches the one qiskit-aer uses for the same
# problem.
#
# Linux-only: this is a glibc mechanism and macOS has no equivalent limit. Note glibc
# silently ignores an unrecognized tunable name, so a typo here would look like a
# working config. Remove this once 17213 is fixed in a release.
setenv =
  linux: GLIBC_TUNABLES = glibc.rtld.optional_static_tls=4096
extras =
  nbtest
  notebook-dependencies
commands =
  pytest --nbmake \
         --nbmake-timeout=3000 \
         --ignore=docs/guides/benchmark_pauli_projection.ipynb \
         --ignore=docs/guides/integrate_dice_solver.ipynb \
         --ignore=docs/guides/use_oo_to_optimize_hamiltonian_basis.ipynb \
         --ignore=docs/guides/choose_subspace_dimension.ipynb \
         {posargs} docs/

[testenv:coverage]
deps =
  coverage>=7.5
extras =
  test
commands =
  coverage3 run --source qiskit_addon_sqd --parallel-mode -m pytest test/ {posargs}
  coverage3 combine
  coverage3 html
  coverage3 report --fail-under=75 --show-missing

[testenv:docs]
basepython = python3.10
extras =
  docs
commands =
  sphinx-build -j auto -W -T --keep-going -b html {posargs} {toxinidir}/docs/ {toxinidir}/docs/_build/html
passenv =
  CI
  GITHUB_BASE_REF
  GITHUB_REF_NAME

[testenv:docs-clean]
skip_install = true
allowlist_externals =
  rm
commands =
  rm -rf {toxinidir}/docs/stubs/ {toxinidir}/docs/_build/
