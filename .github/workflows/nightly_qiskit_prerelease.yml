name: Nightly qiskit prerelease tests

# A qiskit pre-release is published to PyPI as a wheel built by
# qiskit's own release pipeline, which at times has enabled features a
# `python -m build` from a git checkout does not -- mimalloc among
# them. `Development version tests` builds qiskit from source, so a
# defect that only the released wheel exhibits is invisible there no
# matter how often it runs. Installing the pre-release wheel from PyPI
# is the only way to see it before the final release lands.
#
# Running every night is pointless once the newest release is final, since
# `Latest version tests` resolves that same wheel, so the first job decides
# whether there is anything to do.

on:
  schedule:
    - cron: '43 3 * * *'
  # Also run when the workflow or its helper changes, so a pull request can
  # exercise it rather than finding out after it lands on main.
  pull_request:
    paths:
      - '.github/workflows/nightly_qiskit_prerelease.yml'
      - 'tools/latest_qiskit_release.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-for-prerelease:
    name: Check whether a qiskit prerelease is newest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      newest: ${{ steps.release.outputs.newest }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      # A pull request is exercising the workflow itself, so it proceeds even
      # when the newest release is final -- otherwise the change cannot be
      # tested except by waiting for an rc.
      proceed: ${{ steps.release.outputs.prerelease == 'true' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install packaging
        run: |
          python -m pip install --upgrade pip
          pip install packaging
      - name: Find the newest qiskit on PyPI
        id: release
        run: python tools/latest_qiskit_release.py

  tests:
    name: nightly prerelease tests (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: check-for-prerelease
    if: needs.check-for-prerelease.outputs.proceed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox 'extremal-python-dependencies<2'
      # BLAS/LAPACK and OpenMP are needed to build fulqrum, and MPI and BLAS to
      # build sbd-eigensolver, for notebook testing
      - name: Install BLAS/LAPACK and MPI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libblas-dev liblapack-dev libopenblas-dev libopenmpi-dev openmpi-bin
      - name: Install OpenMP and BLAS (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # No CC/CXX exported job-wide; see the comment in test_latest_versions.yml.
        run: |
          brew install llvm libomp open-mpi openblas
      - name: Build the compiled dependencies as wheels (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # fulqrum needs Homebrew LLVM for its bare `-fopenmp`; sbd-eigensolver
        # needs Apple clang so its OpenMP matches the libomp OpenBLAS loads.
        # They cannot share a compiler, so each is built here rather than inside
        # tox's single venv -- see test_latest_versions.yml for the full reasoning.
        run: |
          mkdir -p macos-wheels
          LLVM_PREFIX="$(brew --prefix llvm)"
          OMP_PREFIX="$(brew --prefix libomp)"
          (
            export CC="${LLVM_PREFIX}/bin/clang"
            export CXX="${LLVM_PREFIX}/bin/clang++"
            export LDFLAGS="-L${LLVM_PREFIX}/lib -L${OMP_PREFIX}/lib -Wl,-rpath,${LLVM_PREFIX}/lib"
            export CPPFLAGS="-I${LLVM_PREFIX}/include -I${OMP_PREFIX}/include"
            python -m pip wheel --no-deps --no-binary fulqrum -w macos-wheels fulqrum
          )
          # Apple clang, deliberately unpinned.
          python -m pip wheel --no-deps --no-binary sbd-eigensolver -w macos-wheels sbd-eigensolver
          ls -1 macos-wheels
      - name: Pin the locally built wheels (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          extremal-python-dependencies pin-dependencies --inplace
          "fulqrum @ file:$(echo macos-wheels/fulqrum-*.whl)"
          "sbd-eigensolver @ file:$(echo macos-wheels/sbd_eigensolver-*.whl)"
      # An exact `==` pin naming a pre-release opts that one package in, so pip
      # installs the rc wheel while every other dependency still resolves to a
      # final release. `--pre` would admit pre-releases of everything.
      #
      # On a pull_request run with no pre-release outstanding this pins the
      # newest final release instead, which still exercises the workflow.
      - name: Pin qiskit to the newest release on PyPI
        shell: bash
        env:
          NEWEST: ${{ needs.check-for-prerelease.outputs.newest }}
        run: |
          extremal-python-dependencies pin-dependencies --inplace "qiskit==${NEWEST}"
          grep -n 'qiskit==' pyproject.toml
      # Cap the SQD subspace dimension in the Fulqrum guide for CI execution only.
      # This edits the working-tree copy so tox -e notebook fits in
      # the runner's memory.
      - name: Cap notebook memory for CI
        run: python tools/ci_cap_notebook_memory.py
      # This is where the whole dependency graph is resolved and compiled.
      - name: Install the tox test environment
        shell: bash
        run: tox -e py --notest
      - name: Show the installed qiskit
        shell: bash
        run: .tox/py/bin/python -c "import qiskit; print('qiskit', qiskit.__version__)"
      - name: Test using tox environment
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          tox -e py,notebook
