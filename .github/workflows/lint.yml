name: Lint check

on:
  push:
    branches:
      - main
      - 'stable/**'
      # TEMPORARY(coheriq-engine): revert before merging -- see the commit
      # that added this line.  Lets the full CI matrix run on this branch, which
      # otherwise gets no test workflows because they gate on main.
      - coheriq-engine
  pull_request:
    branches:
      - main
      - 'stable/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Run lint check
        shell: bash
        run: |
          tox -elint
