name: Development version tests

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  schedule:
    - cron: '0 1 * * *'

jobs:
  tests:
    name: development version tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Building five development wheels before the test run leaves this job
    # sensitive to runner speed: the same content has taken anywhere from
    # 24 to over 30 minutes, so 30 was not a reliable ceiling. At 30 the job
    # was cancelled mid-notebook-run, after the unit tests had already passed.
    timeout-minutes: 60
    strategy:
      # One failing cell should not hide the state of the rest.
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      # BLAS/LAPACK and OpenMP are needed to build fulqrum, and MPI and BLAS to
      # build sbd-eigensolver, for notebook testing
      - name: Install BLAS/LAPACK and MPI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev libopenblas-dev libopenmpi-dev openmpi-bin
      - name: Install OpenMP and BLAS (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # No CC/CXX exported here on purpose. Only fulqrum needs a non-Apple
        # compiler, and it gets one in its own build step below; pinning Homebrew
        # LLVM for the whole job breaks sbd-eigensolver, which links OpenBLAS.
        # Homebrew's openblas depends on the standalone libomp formula and loads
        # that copy at run time, so building sbd against a compiler carrying its
        # own libomp puts two same-named runtimes in one process and aborts at the
        # first parallel region -- Qiskit/sbd-eigensolver-python#27. Apple clang
        # takes its OpenMP from the same libomp formula OpenBLAS uses, so left
        # alone the two agree.
        run: |
          brew install llvm libomp open-mpi openblas
      - name: Install tools from pypi
        run: |
          python -m pip install tox build 'extremal-python-dependencies<2'
      - name: Build fulqrum development wheel
        shell: bash
        # fulqrum passes a bare `-fopenmp`, which Apple clang rejects, so this
        # build -- and only this build -- uses Homebrew LLVM. Scoped to the step
        # rather than written to GITHUB_ENV so it does not follow the other builds.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            LLVM_PREFIX="$(brew --prefix llvm)"
            OMP_PREFIX="$(brew --prefix libomp)"
            export CC="${LLVM_PREFIX}/bin/clang"
            export CXX="${LLVM_PREFIX}/bin/clang++"
            export LDFLAGS="-L${LLVM_PREFIX}/lib -L${OMP_PREFIX}/lib -Wl,-rpath,${LLVM_PREFIX}/lib"
            export CPPFLAGS="-I${LLVM_PREFIX}/include -I${OMP_PREFIX}/include"
          fi
          git clone --recurse-submodules https://github.com/qiskit-community/fulqrum
          cd fulqrum
          git rev-parse HEAD
          python -m build --wheel
      - name: Build sbd-eigensolver development wheel
        run: |
          git clone --recurse-submodules https://github.com/Qiskit/sbd-eigensolver-python
          cd sbd-eigensolver-python
          git rev-parse HEAD
          python -m build --wheel
      - name: Build Qiskit SDK development wheel
        run: |
          git clone https://github.com/Qiskit/qiskit
          cd qiskit
          git rev-parse HEAD
          python -m build --wheel
      - name: Build qiskit-ibm-runtime development wheel
        run: |
          git clone https://github.com/Qiskit/qiskit-ibm-runtime
          cd qiskit-ibm-runtime
          git rev-parse HEAD
          python -m build --wheel
      - name: Build qiskit-addon-utils development wheel
        run: |
          git clone https://github.com/Qiskit/qiskit-addon-utils
          cd qiskit-addon-utils
          git rev-parse HEAD
          python -m build --wheel
      - name: Pin development versions
        shell: bash
        run: >-
          extremal-python-dependencies pin-dependencies --inplace
          "fulqrum @ file:$(echo fulqrum/dist/*.whl)"
          "sbd-eigensolver @ file:$(echo sbd-eigensolver-python/dist/*.whl)"
          "qiskit @ file:$(echo qiskit/dist/*.whl)"
          "qiskit-ibm-runtime @ file:$(echo qiskit-ibm-runtime/dist/*.whl)"
          "qiskit-addon-utils @ file:$(echo qiskit-addon-utils/dist/*.whl)"
      - name: Test using tox environment
        shell: bash
        run: |
          tox -e py,notebook
