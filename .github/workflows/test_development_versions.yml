name: Development version tests

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  schedule:
    - cron: '0 1 * * *'

jobs:
  tests:
    name: development version tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Building five development wheels before the test run leaves this job
    # sensitive to runner speed: the same content has taken anywhere from
    # 24 to over 30 minutes, so 30 was not a reliable ceiling. At 30 the job
    # was cancelled mid-notebook-run, after the unit tests had already passed.
    timeout-minutes: 60
    strategy:
      # One failing cell should not hide the state of the rest.
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      # BLAS/LAPACK and OpenMP are needed to build fulqrum, and MPI and BLAS to
      # build sbd-eigensolver, for notebook testing
      - name: Install BLAS/LAPACK and MPI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev libopenblas-dev libopenmpi-dev openmpi-bin
      - name: Bootstrap OpenMP-capable compiler (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm libomp open-mpi openblas
          LLVM_PREFIX="$(brew --prefix llvm)"
          OMP_PREFIX="$(brew --prefix libomp)"
          {
            echo "CC=${LLVM_PREFIX}/bin/clang"
            echo "CXX=${LLVM_PREFIX}/bin/clang++"
            echo "LDFLAGS=-L${LLVM_PREFIX}/lib -L${OMP_PREFIX}/lib -Wl,-rpath,${LLVM_PREFIX}/lib"
            echo "CPPFLAGS=-I${LLVM_PREFIX}/include -I${OMP_PREFIX}/include"
          } >> "$GITHUB_ENV"
      - name: Install tools from pypi
        run: |
          python -m pip install tox build 'extremal-python-dependencies<2'
      - name: Build fulqrum development wheel
        run: |
          git clone --recurse-submodules https://github.com/qiskit-community/fulqrum
          cd fulqrum
          git rev-parse HEAD
          python -m build --wheel
      - name: Build sbd-eigensolver development wheel
        run: |
          # TEMPORARY: track the darwin-single-libomp branch rather than main, to
          # test the fix for the macOS "OMP: Error #15" abort
          # (Qiskit/sbd-eigensolver-python#27). Revert to main once that lands.
          git clone --recurse-submodules --branch darwin-single-libomp \
            https://github.com/Qiskit/sbd-eigensolver-python
          cd sbd-eigensolver-python
          git rev-parse HEAD
          python -m build --wheel
      - name: Build Qiskit SDK development wheel
        run: |
          git clone https://github.com/Qiskit/qiskit
          cd qiskit
          git rev-parse HEAD
          python -m build --wheel
      - name: Build qiskit-ibm-runtime development wheel
        run: |
          git clone https://github.com/Qiskit/qiskit-ibm-runtime
          cd qiskit-ibm-runtime
          git rev-parse HEAD
          python -m build --wheel
      - name: Build qiskit-addon-utils development wheel
        run: |
          git clone https://github.com/Qiskit/qiskit-addon-utils
          cd qiskit-addon-utils
          git rev-parse HEAD
          python -m build --wheel
      - name: Pin development versions
        shell: bash
        run: >-
          extremal-python-dependencies pin-dependencies --inplace
          "fulqrum @ file:$(echo fulqrum/dist/*.whl)"
          "sbd-eigensolver @ file:$(echo sbd-eigensolver-python/dist/*.whl)"
          "qiskit @ file:$(echo qiskit/dist/*.whl)"
          "qiskit-ibm-runtime @ file:$(echo qiskit-ibm-runtime/dist/*.whl)"
          "qiskit-addon-utils @ file:$(echo qiskit-addon-utils/dist/*.whl)"
      - name: Test using tox environment
        shell: bash
        run: |
          tox -e py,notebook
      # TEMPORARY diagnostic for Qiskit/sbd-eigensolver-python#27. Runs even when
      # the tests fail, which is the case worth inspecting: it names every
      # OpenMP runtime each compiled extension in the notebook env links, so the
      # second libomp in the process can be attributed to a package rather than
      # guessed at.
      - name: Report OpenMP linkage of compiled extensions (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        # Scan in Python, not shell: this step runs under `bash -e -o pipefail`,
        # where a find|grep|awk pipeline exits nonzero as soon as one inner grep
        # matches nothing, which aborts the step before it prints anything.
        run: |
          .tox/notebook/bin/python - <<'PY'
          import pathlib, subprocess, sysconfig
          from collections import defaultdict

          site = pathlib.Path(sysconfig.get_paths()["purelib"])
          print("site-packages:", site)

          by_runtime = defaultdict(list)
          for f in sorted(site.rglob("*")):
              if f.suffix not in (".so", ".dylib"):
                  continue
              try:
                  out = subprocess.run(["otool", "-L", str(f)], capture_output=True,
                                       text=True).stdout
              except Exception:
                  continue
              for line in out.splitlines()[1:]:
                  lib = line.strip().split(" (compatibility")[0].strip()
                  if any(k in lib.lower() for k in ("libomp", "libiomp", "libgomp")):
                      by_runtime[lib].append(str(f.relative_to(site)))

          print("\n=== every extension that links an OpenMP, grouped by which one")
          for lib in sorted(by_runtime):
              print(f"\n  {lib}")
              for who in by_runtime[lib]:
                  print(f"      {who}")

          print("\n=== OpenMP copies shipped inside site-packages")
          found = [str(p.relative_to(site)) for p in sorted(site.rglob("*"))
                   if p.name.startswith(("libomp", "libiomp", "libgomp"))
                   and p.suffix in (".so", ".dylib")]
          print("\n".join(f"  {p}" for p in found) if found else "  (none)")
          PY
          echo
          echo "=== loaded at run time, in the notebook's own import order"
          # The notebook imports pyscf, then qiskit_addon_sqd.fermion (which pulls
          # in jax), then sbd. Reproduce that exact order -- which runtime
          # initialises first is the whole question.
          DYLD_PRINT_LIBRARIES=1 .tox/notebook/bin/python -c "
          import pyscf
          from qiskit_addon_sqd.fermion import diagonalize_fermionic_hamiltonian
          from sbd.sbd_solver import solve_sci_batch
          print('imports OK')
          " 2>&1 | grep -iE 'libomp|libiomp|libgomp|imports OK|Error' | sort -u || true
