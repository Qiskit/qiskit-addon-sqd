name: Build and publish

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
    branches:
      - main
      - 'stable/**'

jobs:

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build distribution
        run: |
          pipx run build --sdist
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg-sdist
          path: dist/*.tar.gz

  build_universal_wheel:
    name: Build universal (pure-Python) wheel
    runs-on: ubuntu-latest
    steps:
      # No submodules needed: this wheel disables the compiled extension and
      # relies on the pure-Python fallback in recover_configurations.
      - uses: actions/checkout@v7
      - name: Build py3-none-any wheel
        run: |
          pipx run build --wheel -C wheel.cmake=false
      - name: Store the wheel
        uses: actions/upload-artifact@v7
        with:
          name: pkg-wheel-universal
          path: dist/*.whl

  build_binary_wheels:
    name: Build binary wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest    # manylinux + musllinux x86_64
          - os: ubuntu-24.04-arm # manylinux + musllinux aarch64
          - os: macos-14         # arm64
          - os: macos-13         # x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build wheels
        uses: pypa/cibuildwheel@v3
      - name: Store the wheels
        uses: actions/upload-artifact@v7
        with:
          name: pkg-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  github:
    name: Publish to GitHub
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - build_sdist
      - build_universal_wheel
      - build_binary_wheels
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: ghalactic/github-release-from-tag@v6
        with:
          prerelease: false
          generateReleaseNotes: "true"
          assets: |
            - path: dist/*

  pypi:
    name: Publish to pypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - build_sdist
      - build_universal_wheel
      - build_binary_wheels
      - github
    environment:
      name: pypi
      url: https://pypi.org/p/qiskit-addon-sqd
    permissions:
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Publish release to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
