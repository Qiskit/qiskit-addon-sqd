name: Latest version tests

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  schedule:
    - cron: '0 1 * * *'

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One failing cell should not hide the state of the rest, which matters
      # most when a break is specific to one OS.
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox 'extremal-python-dependencies<2'
      # BLAS/LAPACK and OpenMP are needed to build fulqrum, and MPI and BLAS to
      # build sbd-eigensolver, for notebook testing
      - name: Install BLAS/LAPACK and MPI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev libopenblas-dev libopenmpi-dev openmpi-bin
      - name: Install OpenMP and BLAS (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # No CC/CXX exported job-wide. The two extensions that need compiling
        # here want different compilers, and tox cannot express that -- it
        # installs them together into one isolated venv. They are built as wheels
        # in the next step instead, each with its own toolchain.
        run: |
          brew install llvm libomp open-mpi openblas
      - name: Build the compiled dependencies as wheels (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # Only these two packages compile on macOS; both publish an sdist and no
        # macOS wheel, so pip would otherwise build them inside tox's venv under
        # one shared compiler. They cannot share one:
        #
        #   fulqrum passes a bare `-fopenmp`, which Apple clang rejects, so it
        #   needs Homebrew LLVM.
        #
        #   sbd-eigensolver links OpenBLAS, and Homebrew's openblas depends on the
        #   standalone libomp formula and loads that copy at run time. Built under
        #   Homebrew LLVM it would also link that compiler's own libomp, putting
        #   two same-named runtimes in one process -- an abort at the first
        #   parallel region (Qiskit/sbd-eigensolver-python#27). Under Apple clang
        #   it takes OpenMP from the same libomp formula OpenBLAS uses, so the two
        #   agree.
        #
        # Building each wheel here, outside tox, is what lets them differ. Linux
        # is untouched: there both build fine under the system compiler.
        run: |
          mkdir -p macos-wheels
          LLVM_PREFIX="$(brew --prefix llvm)"
          OMP_PREFIX="$(brew --prefix libomp)"
          (
            export CC="${LLVM_PREFIX}/bin/clang"
            export CXX="${LLVM_PREFIX}/bin/clang++"
            export LDFLAGS="-L${LLVM_PREFIX}/lib -L${OMP_PREFIX}/lib -Wl,-rpath,${LLVM_PREFIX}/lib"
            export CPPFLAGS="-I${LLVM_PREFIX}/include -I${OMP_PREFIX}/include"
            python -m pip wheel --no-deps --no-binary fulqrum -w macos-wheels fulqrum
          )
          # Apple clang, deliberately unpinned.
          python -m pip wheel --no-deps --no-binary sbd-eigensolver -w macos-wheels sbd-eigensolver
          ls -1 macos-wheels
      - name: Pin the locally built wheels (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # tox then installs these prebuilt artifacts rather than compiling either
        # package itself, which is what makes the split above stick.
        run: >-
          extremal-python-dependencies pin-dependencies --inplace
          "fulqrum @ file:$(echo macos-wheels/fulqrum-*.whl)"
          "sbd-eigensolver @ file:$(echo macos-wheels/sbd_eigensolver-*.whl)"
      # Run the environments serially. In parallel mode, tox buffers each
      # environment's output and replays it once the run finishes, and a
      # failing environment's stderr does not survive that replay -- which
      # hides the compiler error when building fulqrum from its sdist fails.
      - name: Test using tox environment
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          tox -e py,notebook
